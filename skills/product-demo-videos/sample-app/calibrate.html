<!doctype html>
<html><head><meta charset="utf-8" /><title>Calibrate</title>
<!-- Used by scripts/calibrate.mjs: colored corners check the recording's crop,
     the five targets check that clicks land where they should. -->
<style>
  html, body { margin: 0; height: 100%; background: #fafaf7; font: 15px -apple-system, system-ui, sans-serif; color: #444; overflow: hidden; }
  .c { position: fixed; width: 40px; height: 40px; }
  #tl { left: 0; top: 0; background: #ff0000; } #tr { right: 0; top: 0; background: #00c800; }
  #bl { left: 0; bottom: 0; background: #0000ff; } #br { right: 0; bottom: 0; background: #ffc800; }
  .t { position: fixed; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 2px solid #2f5bea; background: #e9eefd; }
  .t.hit { background: #2f5bea; }
  p { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); margin: 0; }
</style></head>
<body>
  <div class="c" id="tl"></div><div class="c" id="tr"></div><div class="c" id="bl"></div><div class="c" id="br"></div>
  <p>Calibrating. Hands off the mouse for a few seconds.</p>
  <button class="t" style="left:20%;top:30%" aria-label="t1"></button>
  <button class="t" style="left:80%;top:30%" aria-label="t2"></button>
  <button class="t" style="left:50%;top:50%" aria-label="t3"></button>
  <button class="t" style="left:20%;top:75%" aria-label="t4"></button>
  <button class="t" style="left:80%;top:75%" aria-label="t5"></button>
<script>
  window.__clicks = [];
  document.addEventListener("click", (e) => { window.__clicks.push({ x: e.clientX, y: e.clientY, target: e.target.getAttribute("aria-label") }); e.target.classList?.add("hit"); });
</script>
</body></html>
