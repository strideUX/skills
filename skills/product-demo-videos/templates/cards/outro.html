<!doctype html>
<html><head><meta charset="utf-8" />
<!--
  Outro card. Same rules as intro.html. Variables: {{brand}} {{logo}}
  {{eyebrow}} {{title}} {{cta}} {{url}}.
-->
<style>
  {{fontFace}}
  html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2.2vw; padding: 0 10vw; }
  .logo { height: 3.4vw; display: flex; align-items: center; gap: .9vw; font-weight: 650; font-size: 2.3vw; letter-spacing: -.01em; animation: up .8s .05s cubic-bezier(.2,.7,.2,1) both; }
  .logo img { height: 100%; width: auto; }
  .eyebrow { font-size: 1.4vw; opacity: .6; animation: up .8s .3s cubic-bezier(.2,.7,.2,1) both; }
  h2 { margin: 0; font-size: 3.6vw; line-height: 1.1; font-weight: 600; letter-spacing: -.02em; max-width: 70vw; animation: up .9s .45s cubic-bezier(.2,.7,.2,1) both; }
  .url { font-size: 1.7vw; color: var(--accent); font-weight: 550; animation: up .9s .7s cubic-bezier(.2,.7,.2,1) both; }
  .url:empty, .eyebrow:empty, h2:empty { display: none; }
  @keyframes up { from { opacity: 0; transform: translateY(1.2vw); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
</style></head>
<body><div class="wrap">
  <div class="logo">{{logo}}</div>
  <div class="eyebrow">{{eyebrow}}</div>
  <h2>{{cta}}</h2>
  <div class="url">{{url}}</div>
</div></body></html>
